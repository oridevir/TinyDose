<script type="module">
import { supabase, round2, esc, calculateDose } from './app.js';

// Numeric ranges like "6.5–9.75" must read left to right even inside Hebrew
// text; without an LTR isolate the RTL page shows them as "9.75–6.5".
const rng = (a, b) => `\u2066${a}–${b}\u2069`;

const params = new URLSearchParams(location.search);
const medId = params.get('id');
// In free-calc-only mode every entry point (including old catalog links)
// falls back to the free calculation.
const freeMode = window.FREE_CALC_ONLY || params.get('mode') === 'free';
const categoryParam = params.get('category');
const indicationParam = params.get('indication');

const main = document.getElementById('main-content');

// ── Entry routing ──
if (freeMode) {
  renderFreeForm();
} else if (indicationParam) {
  loadIndicationAndRender(indicationParam);
} else if (categoryParam) {
  renderCategoryIndications(categoryParam);
} else if (!medId) {
  renderIndicationSearch();
} else {
  loadMedAndRender(medId);
}

// ── Indication search (catalog flow, step 1) ──
async function renderIndicationSearch() {
  main.innerHTML = `<div class="loading-wrap"><div class="spinner"></div></div>`;

  const { data: indications, error } = await supabase
    .from('indications')
    .select('id, name_he, name_en, medications(id, drug_name, concentration_label)')
    .order('name_he');

  if (error) {
    main.innerHTML = '<div class="card"><p style="color:var(--danger);">שגיאה בטעינת נתונים. נסה לרענן.</p></div>';
    return;
  }

  main.innerHTML = `
    <div class="disclaimer">המינון מחושב לפי משקל הילד. אנא ודא את המינון מול מקורות עדכניים.</div>
    <div class="card">
      <div class="card-title">בחר אינדיקציה</div>
      <div class="field" style="margin-bottom:0;">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="ind-search" placeholder="חפש אינדיקציה..." autocomplete="off">
        </div>
      </div>
    </div>
    <div id="indication-list">
      ${(indications || []).map(ind => `
        <button class="shortcut-btn" style="width:100%;text-align:right;margin-bottom:8px;"
          data-indication-id="${esc(ind.id)}">
          <div class="drug-name">${esc(ind.name_he)}</div>
          ${ind.name_en ? `<div class="indication">${esc(ind.name_en)}</div>` : ''}
          <div class="indication" style="margin-top:4px;">${(ind.medications || []).map(d => esc(d.drug_name) + (d.concentration_label ? ` (${esc(d.concentration_label)})` : '')).join(' · ')}</div>
        </button>
      `).join('')}
    </div>
  `;

  document.getElementById('indication-list').querySelectorAll('[data-indication-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ind = (indications || []).find(x => x.id === btn.getAttribute('data-indication-id'));
      if (!ind) return;
      const meds = ind.medications || [];
      if (meds.length === 0) {
        const noMedsEl = document.createElement('div');
        noMedsEl.className = 'card';
        noMedsEl.innerHTML = `
          <div class="card-title">⚠️ אין תרופות משויכות</div>
          <p style="color:var(--gray-600);margin-bottom:16px;">לאינדיקציה "<strong>${esc(ind.name_he)}</strong>" אין עדיין תרופות משויכות במאגר.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-secondary btn-sm" id="back-to-ind-search">← חזרה לרשימה</button>
            <a href="calculator.html?mode=free" class="btn btn-ghost btn-sm">✏️ חישוב חופשי</a>
          </div>
        `;
        document.getElementById('indication-list').replaceWith(noMedsEl);
        noMedsEl.querySelector('#back-to-ind-search').addEventListener('click', renderIndicationSearch);
      } else if (meds.length === 1) {
        location.href = `calculator.html?id=${meds[0].id}`;
      } else {
        renderDrugSelectorInline(meds, ind.name_he);
      }
    });
  });

  document.getElementById('ind-search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase().trim();
    document.getElementById('indication-list').querySelectorAll('button').forEach(b => {
      b.classList.toggle('hidden', !!q && !b.innerText.toLowerCase().includes(q));
    });
  });
}

// ── Indication direct link (from index.html search: ?indication=<id>) ──
async function loadIndicationAndRender(indId) {
  main.innerHTML = `<div class="loading-wrap"><div class="spinner"></div></div>`;

  const { data: ind, error } = await supabase
    .from('indications')
    .select('id, name_he, name_en, medications(id, drug_name, concentration_label)')
    .eq('id', indId)
    .single();

  if (error || !ind) {
    main.innerHTML = `<div class="card"><p style="color:var(--danger);">שגיאה בטעינת נתונים. נסה לרענן.</p></div>`;
    return;
  }

  const meds = ind.medications || [];

  if (meds.length === 0) {
    main.innerHTML = `
      <div class="card">
        <div class="card-title">⚠️ אין תרופות משויכות</div>
        <p style="color:var(--gray-600);margin-bottom:16px;">לאינדיקציה "<strong>${esc(ind.name_he)}</strong>" אין עדיין תרופות משויכות במאגר.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <a href="index.html" class="btn btn-secondary btn-sm">← חזרה לחיפוש</a>
          <a href="calculator.html?mode=free" class="btn btn-ghost btn-sm">✏️ חישוב חופשי</a>
        </div>
      </div>
    `;
  } else if (meds.length === 1) {
    loadMedAndRender(meds[0].id);
  } else {
    renderDrugSelectorForIndication(meds, ind.name_he);
  }
}

function renderDrugSelectorForIndication(drugs, indicationHe) {
  main.innerHTML = `
    <div class="card">
      <div class="card-title">בחר תרופה עבור: ${esc(indicationHe)}</div>
      <div class="drug-options">
        ${drugs.map((d, i) => `
          <label class="drug-option ${i === 0 ? 'selected' : ''}">
            <input type="radio" name="drug" value="${esc(d.id)}" ${i === 0 ? 'checked' : ''}>
            <div>
              <div class="drug-option-label">${esc(d.drug_name)}${d.concentration_label ? ` <span style="font-weight:400;color:var(--gray-500);">(${esc(d.concentration_label)})</span>` : ''}</div>
            </div>
          </label>
        `).join('')}
      </div>
      <button class="btn btn-primary btn-full" style="margin-top:14px;" id="confirm-drug-btn">המשך →</button>
    </div>
  `;

  main.querySelectorAll('input[name=drug]').forEach(r => {
    r.addEventListener('change', () => {
      main.querySelectorAll('.drug-option').forEach(opt => opt.classList.remove('selected'));
      r.closest('.drug-option').classList.add('selected');
    });
  });

  main.querySelector('#confirm-drug-btn').addEventListener('click', () => {
    const selected = main.querySelector('input[name=drug]:checked');
    if (selected) location.href = `calculator.html?id=${selected.value}`;
  });
}

// ── Category flow: show all indications in a category ──
async function renderCategoryIndications(categoryId) {
  main.innerHTML = `<div class="loading-wrap"><div class="spinner"></div></div>`;

  let query = supabase
    .from('indications')
    .select('id, name_he, name_en, medications(id, drug_name, concentration_label)')
    .order('name_he');

  if (categoryId === 'none') {
    query = query.is('category_id', null);
  } else {
    query = query.eq('category_id', categoryId);
  }

  const [indicationsResult, catResult] = await Promise.all([
    query,
    categoryId !== 'none'
      ? supabase.from('categories').select('name_he').eq('id', categoryId).single()
      : Promise.resolve({ data: null }),
  ]);

  if (indicationsResult.error || !indicationsResult.data?.length) {
    main.innerHTML = `<div class="card"><p style="text-align:center;color:var(--gray-400);padding:12px 0;">לא נמצאו אינדיקציות בקטגוריה זו.</p></div>`;
    return;
  }

  const indications = indicationsResult.data;
  const categoryName = catResult.data?.name_he || 'כללי / לא ממוין';

  main.innerHTML = `
    <div class="card">
      <div class="card-title">${esc(categoryName)}</div>
      <p style="font-size:.85rem;color:var(--gray-500);margin:0;">בחר אינדיקציה:</p>
    </div>
    <div id="indication-list">
      ${indications.map(ind => `
        <button class="shortcut-btn" style="width:100%;text-align:right;margin-bottom:8px;"
          data-indication-id="${esc(ind.id)}">
          <div class="drug-name">${esc(ind.name_he)}</div>
          ${ind.name_en ? `<div class="indication">${esc(ind.name_en)}</div>` : ''}
          <div class="indication" style="margin-top:4px;">${(ind.medications || []).map(d => esc(d.drug_name) + (d.concentration_label ? ` (${esc(d.concentration_label)})` : '')).join(' · ')}</div>
        </button>
      `).join('')}
    </div>
  `;

  document.getElementById('indication-list').querySelectorAll('[data-indication-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ind = indications.find(x => x.id === btn.getAttribute('data-indication-id'));
      if (!ind) return;
      const meds = ind.medications || [];
      if (meds.length === 0) {
        main.innerHTML = `
          <div class="card">
            <div class="card-title">⚠️ אין תרופות משויכות</div>
            <p style="color:var(--gray-600);margin-bottom:16px;">לאינדיקציה "<strong>${esc(ind.name_he)}</strong>" אין עדיין תרופות משויכות במאגר.</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-secondary btn-sm" id="back-to-cat">← חזרה לרשימה</button>
              <a href="calculator.html?mode=free" class="btn btn-ghost btn-sm">✏️ חישוב חופשי</a>
            </div>
          </div>
        `;
        main.querySelector('#back-to-cat').addEventListener('click', () => renderCategoryIndications(categoryId));
      } else if (meds.length === 1) {
        location.href = `calculator.html?id=${meds[0].id}`;
      } else {
        renderDrugSelectorInline(meds, ind.name_he);
      }
    });
  });
}

function renderDrugSelectorInline(drugs, indicationHe) {
  const container = document.createElement('div');
  container.className = 'card';
  container.innerHTML = `
    <div class="card-title">שלב 2 — בחר תרופה עבור: ${esc(indicationHe)}</div>
    <div class="drug-options">
      ${drugs.map((d, i) => `
        <label class="drug-option ${i === 0 ? 'selected' : ''}">
          <input type="radio" name="drug" value="${esc(d.id)}" ${i === 0 ? 'checked' : ''}>
          <div>
            <div class="drug-option-label">${esc(d.drug_name)}${d.concentration_label ? ` <span style="font-weight:400;color:var(--gray-500);">(${esc(d.concentration_label)})</span>` : ''}</div>
          </div>
        </label>
      `).join('')}
    </div>
    <button class="btn btn-primary btn-full" style="margin-top:14px;" id="confirm-drug-btn">המשך →</button>
  `;

  document.getElementById('indication-list').replaceWith(container);
  container.querySelectorAll('input[name=drug]').forEach(r => {
    r.addEventListener('change', () => {
      container.querySelectorAll('.drug-option').forEach(opt => opt.classList.remove('selected'));
      r.closest('.drug-option').classList.add('selected');
    });
  });

  container.querySelector('#confirm-drug-btn').addEventListener('click', () => {
    const selected = container.querySelector('input[name=drug]:checked');
    if (selected) location.href = `calculator.html?id=${selected.value}`;
  });
}

// ── Load med and show weight input (catalog flow) ──
async function loadMedAndRender(id) {
  main.innerHTML = `<div class="loading-wrap"><div class="spinner"></div></div>`;

  const { data: med, error } = await supabase
    .from('medications')
    .select('*, indications(name_he, name_en)')
    .eq('id', id)
    .single();

  if (error || !med) {
    main.innerHTML = '<div class="card"><p style="color:var(--danger);">שגיאה בטעינת נתונים.</p></div>';
    return;
  }

  renderWeightInput(med);
}

function renderWeightInput(med) {
  main.innerHTML = `
    <div class="disclaimer">המינון מחושב לפי משקל הילד. אנא ודא מול מקורות עדכניים.</div>
    <div class="card">
      <div style="margin-bottom:12px;">
        <div style="font-weight:700;font-size:1.1rem;">${esc(med.drug_name)}</div>
        <div style="font-size:.85rem;color:var(--gray-500);">${esc(med.indications?.name_he || '')}</div>
      </div>
      <div class="field">
        <label>משקל הילד</label>
        <div class="input-row">
          <input type="number" id="weight-input" placeholder="0" min="0.5" max="120" step="0.5" inputmode="decimal" autofocus>
          <span class="unit">ק"ג</span>
        </div>
      </div>
      <button class="btn btn-primary btn-full btn-lg" id="calc-btn">
        חשב מינון
      </button>
    </div>
    <div id="result-area"></div>
  `;

  const weightInput = document.getElementById('weight-input');
  const doCalc = () => {
    const w = parseFloat(weightInput.value);
    if (!w || w <= 0) { weightInput.focus(); showToast('יש להזין משקל תקין'); return; }
    renderResult(med, w);
  };

  weightInput.addEventListener('keydown', e => { if (e.key === 'Enter') doCalc(); });
  weightInput.addEventListener('input', () => {
    document.getElementById('result-area').innerHTML = '';
  });
  document.getElementById('calc-btn').addEventListener('click', doCalc);
}

// ── Catalog flow: calculation & result rendering ──
function renderResult(med, weight) {
  const {
    drug_name, concentration_label,
    dose_min_mg_per_kg_day, dose_max_mg_per_kg_day,
    concentration_mg_per_ml, doses_per_day, duration_days,
    max_daily_dose_mg, adult_max_daily_dose_mg, adult_dose_note, notes,
    indications
  } = med;
  const indication_he = indications?.name_he || '';
  const indication_en = indications?.name_en || null;

  const calc = calculateDose({
    weight,
    doseMin: dose_min_mg_per_kg_day,
    doseMax: dose_max_mg_per_kg_day,
    concentration: concentration_mg_per_ml,
    dosesPerDay: doses_per_day,
    maxDailyDoseMg: max_daily_dose_mg,
    adultMaxDailyDoseMg: adult_max_daily_dose_mg,
  });

  const doseStr = calc.hasRange
    ? `${rng(dose_min_mg_per_kg_day, dose_max_mg_per_kg_day)}`
    : `${dose_min_mg_per_kg_day}`;
  const dailyStr = calc.hasRange && calc.dailyMin !== calc.dailyMax
    ? `${rng(calc.dailyMin, calc.dailyMax)} מ"ג`
    : `${calc.dailyMin} מ"ג`;

  const freqMap = { 1: 'פעם ביום', 2: 'פעמיים ביום', 3: 'שלוש פעמים ביום', 4: 'ארבע פעמים ביום' };
  const freqStr = freqMap[doses_per_day] || `${doses_per_day} פעמים ביום`;

  const drugDisplayName = concentration_label ? `${drug_name} (${concentration_label})` : drug_name;

  renderResultArea({
    drugName: drugDisplayName,
    indicationHe: indication_he,
    indicationEn: indication_en,
    weight,
    steps: [
      { label: 'שלב א׳ — משקל הילד', value: `${weight} ק"ג` },
      { label: 'שלב ב׳ — מינון יומי', value: `${weight} ק"ג × ${doseStr} מ"ג/ק"ג/יום = ${dailyStr} ליום` },
    ],
    calc,
    dosesPerDay: doses_per_day,
    durationDays: duration_days,
    freqStr,
    concentration: concentration_mg_per_ml,
    maxDailyDoseMg: max_daily_dose_mg,
    adultDoseNote: adult_dose_note,
    catalogNotes: notes,
    freeMode: false,
  });
}

// ── Sky parallax ──
// Clouds lag behind the scroll by their data-depth (0 = moves with the page,
// higher = farther away and slower), which gives the sky a 3D feel. Each
// cloud sits exactly at its designed spot when it is in the middle of the
// screen. Skipped for users who ask for reduced motion.
// (A function property, not a `let`: the page routing calls renderFreeForm
// before this line is reached.)
function startParallax() {
  if (startParallax.done) return;
  startParallax.done = true;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const clouds = [...document.querySelectorAll('.sky .cloud')].map(el => ({
    // SVG elements have no offsetTop, so measure from the bounding box.
    el, depth: parseFloat(el.dataset.depth) || 0, top: el.getBoundingClientRect().top + window.scrollY,
  }));
  let ticking = false;
  const update = () => {
    ticking = false;
    const mid = window.scrollY + window.innerHeight / 2;
    for (const c of clouds) c.el.style.translate = `0 ${Math.round((mid - c.top) * c.depth)}px`;
  };
  const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();
}

// ── Free calculation flow ──
function renderFreeForm() {
  document.body.classList.add('ff-page');
  startParallax();
  main.innerHTML = `
    <div class="ff">
      <div class="ff-cloud">
        <div class="ff-cloud-title">פרטים להדפסה ושליחה · לא חובה</div>
        <div class="ff-who">
          <input type="text" id="ff-patient" placeholder="שם המטופל" aria-label="שם המטופל" autocomplete="off">
          <input type="text" id="ff-patient-id" placeholder="מספר זהות" aria-label="מספר זהות" inputmode="numeric" maxlength="9" autocomplete="off">
          <input type="text" id="ff-diagnosis" placeholder="אבחנה" aria-label="אבחנה" autocomplete="off">
          <input type="text" id="ff-drug" placeholder="שם התרופה" aria-label="שם התרופה" autocomplete="off">
        </div>
      </div>

      <div class="ff-balloon-wrap">
        <div class="ff-balloon">
          <label for="ff-weight">משקל הילד</label>
          <input type="number" id="ff-weight" placeholder="?" min="0.5" max="120" step="0.5" inputmode="decimal">
          <span>ק"ג</span>
        </div>
        <svg class="ff-string" viewBox="0 0 40 30" aria-hidden="true"><path d="M20 0 C 8 9, 32 16, 18 30" fill="none" stroke="#e64a80" stroke-width="2"/></svg>
      </div>
      <div class="ff-slider is-empty" id="ff-slider-box">
        <input type="range" id="ff-weight-slider" dir="ltr" min="1" max="40" step="0.5" value="1" aria-label="משקל הילד בסרגל">
        <div class="ff-ticks" dir="ltr" aria-hidden="true">${[1, 10, 20, 30, 40].map(v =>
          `<span style="left:${((v - 1) / 39) * 100}%">${v}</span>`).join('')}</div>
      </div>

      <div class="ff-pill ff-peach">
        <label for="ff-dose-min">מינון נדרש · מ"ג/ק"ג/יום *</label>
        <div class="ff-pair">
          <input type="number" id="ff-dose-min" min="0" step="any" inputmode="decimal">
          <span>עד</span>
          <input type="number" id="ff-dose-max" min="0" step="any" inputmode="decimal" aria-label="מינון מקסימום (לא חובה)">
        </div>
        <p class="ff-hint">מינון קבוע ולא טווח? השאר את השדה השני ריק</p>
      </div>
      <div class="ff-pill ff-yellow">
        <label for="ff-doses">מספר מנות ביום *</label>
        <div class="ff-pair"><input type="number" id="ff-doses" min="1" max="6" step="1" inputmode="numeric"><span>מנות</span></div>
      </div>
      <div class="ff-pill ff-green">
        <label for="ff-conc-mg">ריכוז הסירופ *</label>
        <div class="ff-pair">
          <input type="number" id="ff-conc-mg" min="0" step="any" inputmode="decimal" aria-label="מ&quot;ג">
          <span>מ"ג ב־</span>
          <input type="number" id="ff-conc-ml" min="0" step="any" inputmode="decimal" aria-label="מ&quot;ל">
          <span>מ"ל</span>
        </div>
        <p id="ff-conc-result" class="ff-hint"></p>
      </div>
      <div class="ff-pill ff-lilac">
        <label for="ff-maxdaily">מקסימום יומי · מומלץ מאוד</label>
        <div class="ff-pair"><input type="number" id="ff-maxdaily" min="0" step="any" inputmode="decimal"><span>מ"ג</span></div>
      </div>

      <div class="ff-bubble">
        <div class="ff-bubble-text">
          <small>לתת בכל פעם</small>
          <div class="ff-big" id="ff-live-vol">—</div>
          <small id="ff-live-sub">מלא את השדות המסומנים ב-*</small>
        </div>
        <svg class="ff-cup" viewBox="0 0 100 124" role="img" aria-label="כוס מדידה">
          <defs><clipPath id="ff-cup-clip"><path d="M14 12 L86 12 L76 112 L24 112 Z"/></clipPath></defs>
          <path d="M14 12 L86 12 L76 112 L24 112 Z" fill="rgba(255,255,255,.18)"/>
          <g clip-path="url(#ff-cup-clip)">
            <g id="ff-liquid" class="ff-liquid" style="transform: translateY(118px)">
              <path class="ff-wave" fill="#ff7eb3" d=""/>
            </g>
          </g>
          <g id="ff-cup-ticks" fill="#fff" font-size="9" font-family="Varela Round, Arial, sans-serif"></g>
          <path d="M14 12 L86 12 L76 112 L24 112 Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
          <text id="ff-cup-size" x="50" y="123" text-anchor="middle" fill="#dff0ff" font-size="9" font-family="Varela Round, Arial, sans-serif"></text>
        </svg>
      </div>
    </div>
    <div id="result-area"></div>
  `;

  const $ = id => document.getElementById(id);
  const weightInput = $('ff-weight');
  const slider = $('ff-weight-slider');
  const concMgInput = $('ff-conc-mg');
  const concMlInput = $('ff-conc-ml');

  // Liquid surface: a sine wave wider than the cup so it can scroll sideways.
  let d = 'M-40 0';
  for (let x = -40; x < 140; x += 20) d += ` Q${x + 5} -4 ${x + 10} 0 T${x + 20} 0`;
  document.querySelector('#ff-liquid .ff-wave').setAttribute('d', d + ' V140 H-40 Z');

  const SVGNS = 'http://www.w3.org/2000/svg';
  const CUP_TOP = 12, CUP_BOTTOM = 112;
  let cupCapacity = null;
  function drawCup(vol) {
    const liquid = $('ff-liquid');
    if (!(vol > 0)) { liquid.style.transform = 'translateY(118px)'; return; }
    const cap = vol <= 10 ? 10 : vol <= 20 ? 20 : 30;
    if (cap !== cupCapacity) {
      cupCapacity = cap;
      const ticks = $('ff-cup-ticks');
      ticks.textContent = '';
      const step = cap === 10 ? 2 : 5;
      for (let v = step; v <= cap; v += step) {
        const y = CUP_BOTTOM - (CUP_BOTTOM - CUP_TOP) * v / cap;
        // Ticks hug the slanted left wall; numbers sit just outside it.
        const edgeX = 14 + 10 * (y - CUP_TOP) / (CUP_BOTTOM - CUP_TOP);
        const line = document.createElementNS(SVGNS, 'rect');
        line.setAttribute('x', edgeX); line.setAttribute('y', y - 0.8); line.setAttribute('width', 9); line.setAttribute('height', 1.6);
        const label = document.createElementNS(SVGNS, 'text');
        label.setAttribute('x', edgeX - 4); label.setAttribute('y', y + 3); label.setAttribute('text-anchor', 'end'); label.textContent = v;
        ticks.append(line, label);
      }
      $('ff-cup-size').textContent = `כוס ${cap} מ"ל`;
    }
    const f = Math.min(vol, cap) / cap;
    liquid.style.transform = `translateY(${CUP_BOTTOM - (CUP_BOTTOM - CUP_TOP) * f}px)`;
    if (vol > 30) $('ff-cup-size').textContent = 'יותר מכוס אחת';
  }

  function readForm() {
    const doseMaxRaw = $('ff-dose-max').value;
    const maxDailyRaw = $('ff-maxdaily').value;
    return {
      drugName: $('ff-drug').value.trim(),
      patientName: $('ff-patient').value.trim(),
      patientId: $('ff-patient-id').value.trim(),
      diagnosis: $('ff-diagnosis').value.trim(),
      weight: parseFloat(weightInput.value),
      doseMin: parseFloat($('ff-dose-min').value),
      doseMax: doseMaxRaw ? parseFloat(doseMaxRaw) : null,
      dosesPerDay: parseInt($('ff-doses').value),
      concMg: parseFloat(concMgInput.value),
      concMl: parseFloat(concMlInput.value),
      maxDailyDoseMg: maxDailyRaw ? parseFloat(maxDailyRaw) : null,
    };
  }

  // Live preview in the bubble. Uses the same calculateDose() as the detailed
  // result, so the exceeded-max safety behavior is identical.
  function updateLive() {
    const f = readForm();
    const volEl = $('ff-live-vol'), subEl = $('ff-live-sub');
    concResult();

    const ready = f.weight > 0 && f.doseMin > 0 && f.dosesPerDay > 0 && f.concMg > 0 && f.concMl > 0;
    if (!ready) {
      volEl.textContent = '—'; volEl.classList.remove('is-range');
      subEl.textContent = 'מלא את השדות המסומנים ב-*';
      drawCup(null);
      showResultPlaceholder('פירוט החישוב יופיע כאן אחרי שימולאו כל השדות המסומנים ב-*');
      return;
    }
    if (f.doseMax != null && f.doseMax < f.doseMin) {
      volEl.textContent = '—'; volEl.classList.remove('is-range');
      subEl.textContent = 'מינון ה"עד" קטן מה"מ-"';
      drawCup(null);
      showResultPlaceholder('מינון ה"עד" קטן ממינון ה"מ-". יש לתקן את טווח המינון.');
      return;
    }
    const calc = calculateDose({
      weight: f.weight, doseMin: f.doseMin, doseMax: f.doseMax,
      concentration: round2(f.concMg / f.concMl), dosesPerDay: f.dosesPerDay,
      maxDailyDoseMg: f.maxDailyDoseMg,
    });
    const freqMap = { 1: 'פעם ביום', 2: 'פעמיים ביום', 3: 'שלוש פעמים ביום', 4: 'ארבע פעמים ביום' };
    const freqStr = freqMap[f.dosesPerDay] || `${f.dosesPerDay} פעמים ביום`;
    if (calc.exceeded) {
      volEl.textContent = '—'; volEl.classList.remove('is-range');
      subEl.textContent = 'חריגה מהמקסימום היומי';
      drawCup(null);
      renderDetails(f);
      return;
    }
    const range = (a, b) => (calc.hasRange && a !== b) ? `${rng(a, b)}` : `${a}`;
    volEl.textContent = `${range(calc.volMin, calc.volMax)} מ"ל`;
    volEl.classList.toggle('is-range', calc.hasRange && calc.volMin !== calc.volMax);
    if (volEl.dataset.last !== volEl.textContent) {
      volEl.dataset.last = volEl.textContent;
      volEl.classList.remove('pop'); void volEl.offsetWidth; volEl.classList.add('pop');
    }
    subEl.textContent = `${freqStr} · ${range(calc.perDoseMin, calc.perDoseMax)} מ"ג למנה`;
    drawCup(calc.volMax);
    renderDetails(f);
  }

  // The detailed steps + share/print/reset always sit under the bubble and
  // follow every keystroke. Doctor notes typed there survive the re-render.
  function renderDetails(f) {
    const notesEl = document.getElementById('doctor-notes');
    const notes = notesEl ? notesEl.value : '';
    renderFreeResult({ ...f, conc: round2(f.concMg / f.concMl), scroll: false });
    const newNotes = document.getElementById('doctor-notes');
    if (newNotes) newNotes.value = notes;
  }

  function showResultPlaceholder(text) {
    $('result-area').innerHTML = `<div class="ff-placeholder">${esc(text)}</div>`;
  }

  function concResult() {
    const mg = parseFloat(concMgInput.value);
    const ml = parseFloat(concMlInput.value);
    $('ff-conc-result').textContent = (mg > 0 && ml > 0) ? `= ${round2(mg / ml)} מ"ג למ"ל` : '';
  }

  // Weight: the number field and the slider stay in sync. The slider only
  // covers 1–40 kg; heavier children are typed in.
  // The weight starts empty so nothing is calculated from a weight nobody
  // entered. Until then the slider is dimmed and parked at the left end.
  const sliderBox = $('ff-slider-box');
  slider.addEventListener('input', () => {
    weightInput.value = slider.value;
    sliderBox.classList.remove('is-empty');
  });
  weightInput.addEventListener('input', () => {
    const w = parseFloat(weightInput.value);
    if (w > 0) {
      slider.value = Math.min(w, 40);
      sliderBox.classList.remove('is-empty');
    } else {
      slider.value = 1;
      sliderBox.classList.add('is-empty');
    }
  });

  document.querySelector('.ff').addEventListener('input', updateLive);

  updateLive();
}

function renderFreeResult({ drugName, patientName, patientId, diagnosis, doseMin, doseMax, conc, dosesPerDay, maxDailyDoseMg, weight, scroll = true }) {
  const calc = calculateDose({
    weight, doseMin, doseMax, concentration: conc, dosesPerDay, maxDailyDoseMg,
  });

  const doseStr = calc.hasRange ? `${rng(doseMin, doseMax)}` : `${doseMin}`;
  const dailyStr = calc.hasRange && calc.dailyMin !== calc.dailyMax
    ? `${rng(calc.dailyMin, calc.dailyMax)} מ"ג`
    : `${calc.dailyMin} מ"ג`;

  const freqMap = { 1: 'פעם ביום', 2: 'פעמיים ביום', 3: 'שלוש פעמים ביום', 4: 'ארבע פעמים ביום' };
  const freqStr = freqMap[dosesPerDay] || `${dosesPerDay} פעמים ביום`;

  const displayName = drugName || 'חישוב מינון';

  renderResultArea({
    drugName: displayName,
    indicationHe: diagnosis || null,
    patientName, patientId,
    indicationEn: null,
    weight,
    steps: [
      { label: 'שלב א׳ — משקל הילד', value: `${weight} ק"ג` },
      { label: 'שלב ב׳ — מינון יומי', value: `${weight} ק"ג × ${doseStr} מ"ג/ק"ג/יום = ${dailyStr} ליום` },
    ],
    calc,
    dosesPerDay,
    durationDays: null,
    freqStr,
    concentration: conc,
    maxDailyDoseMg,
    adultDoseNote: null,
    catalogNotes: null,
    freeMode: true,
    scroll,
  });
}

// ── Shared result-area renderer for BOTH flows ──
function renderResultArea({
  drugName, indicationHe, indicationEn, weight, steps,
  calc, dosesPerDay, durationDays, freqStr, concentration, maxDailyDoseMg,
  adultDoseNote, catalogNotes, freeMode, patientName, patientId, scroll = true
}) {
  const resultArea = document.getElementById('result-area');
  const patientStr = [patientName, patientId ? `ת.ז. ${patientId}` : ''].filter(Boolean).join(' · ');
  const indicationDisplay = indicationHe || (freeMode ? 'חישוב חופשי' : '');
  const patientHeaderHtml = patientStr ? `<div class="result-indication">👤 ${esc(patientStr)}</div>` : '';
  const durationStr = durationDays ? `${durationDays} ימים` : null;

  const stepHtml = s => `
    <div class="calc-step">
      <div class="step-label">${esc(s.label)}</div>
      <div class="step-value">${esc(s.value)}</div>
    </div>
  `;

  // ── EXCEEDED CASE: do not show a weight-based ml result at all.
  // Show the adult-dose fallback as the primary, final answer instead.
  if (calc.exceeded) {
    let adultBlockHtml;

    if (freeMode) {
      adultBlockHtml = `<div class="warning-box" style="background:var(--danger-light);border-color:#fecaca;color:var(--danger);">
           <span class="warn-icon">⛔</span>
           <div>
             <strong>המינון שחושב (${calc.dailyMax} מ"ג) חורג מהמינון המקסימלי היומי שהזנת (${maxDailyDoseMg} מ"ג).</strong><br>
             במסלול חישוב חופשי המערכת אינה קובעת מינון חלופי — יש לקבוע את המינון המתאים על דעת הרופא בלבד.
           </div>
         </div>`;
    } else if (calc.adultVolMl != null) {
      // We have enough data to auto-compute the adult dose in ml.
      const adultVolStr = `${calc.adultVolMl} מ"ל`;
      adultBlockHtml = `
         <div class="warning-box" style="background:var(--warning-light);border-color:#fde68a;">
           <span class="warn-icon">⚠️</span>
           <div>
             <strong>המינון שחושב (${calc.dailyMax} מ"ג) חורג מהמינון המירבי המותר (${maxDailyDoseMg} מ"ג).</strong><br>
             במקרה זה המינון הנדרש זהה למינון המבוגרים.
           </div>
         </div>
         <div class="result-summary" style="margin-top:12px;">
           <div class="summary-line">
             תן <span class="highlight">${adultVolStr}</span> — ${freqStr}${durationStr ? `<br>למשך ${durationStr}` : ''}<br>
             <span style="font-size:.88rem;font-weight:500;color:var(--gray-500);">מינון מבוגרים: ${calc.adultPerDoseMg} מ"ג לנטילה</span>
           </div>
         </div>
         ${adultDoseNote ? `<div class="notes-box">📋 ${esc(adultDoseNote)}</div>` : ''}`;
    } else {
      // No structured adult ceiling available — fall back to generic message + free text.
      adultBlockHtml = `
         <div class="warning-box" style="background:var(--warning-light);border-color:#fde68a;">
           <span class="warn-icon">⚠️</span>
           <div>
             <strong>המינון שחושב (${calc.dailyMax} מ"ג) חורג מהמינון המירבי המותר (${maxDailyDoseMg} מ"ג).</strong><br>
             במקרה זה יש לעבור למינון מבוגרים הרגיל עבור תרופה זו.
           </div>
         </div>
         ${adultDoseNote ? `
         <div class="result-summary" style="margin-top:12px;">
           <div class="summary-line">${esc(adultDoseNote)}</div>
         </div>` : ''}`;
    }

    resultArea.innerHTML = `
      <div class="result-card">
        <div class="result-header" style="background:var(--warning);">
          <div class="result-drug">${esc(drugName)}</div>
          <div class="result-indication">${esc(indicationDisplay)}${indicationEn ? ' · ' + esc(indicationEn) : ''}</div>
          ${patientHeaderHtml}
        </div>
        <div class="result-body">
          ${steps.map(stepHtml).join('')}
          ${adultBlockHtml}
        </div>
      </div>
    `;
    if (scroll) document.getElementById('result-area').scrollIntoView({ behavior: 'smooth' });
    return;
  }

  // ── NORMAL CASE ──
  const perDoseStr = calc.hasRange && calc.perDoseMin !== calc.perDoseMax
    ? `${rng(calc.perDoseMin, calc.perDoseMax)} מ"ג`
    : `${calc.perDoseMin} מ"ג`;
  const volStr = calc.hasRange && calc.volMin !== calc.volMax
    ? `${rng(calc.volMin, calc.volMax)} מ"ל`
    : `${calc.volMin} מ"ל`;
  const volDisplay = `<span class="highlight">${volStr}</span>`;

  const dailyNumStr = calc.hasRange && calc.dailyMin !== calc.dailyMax
    ? `${rng(calc.dailyMin, calc.dailyMax)}`
    : `${calc.dailyMin}`;

  const allSteps = [
    ...steps,
    { label: 'שלב ג׳ — מינון לכל מנה', value: `${dailyNumStr} מ"ג ÷ ${dosesPerDay} מנות = ${perDoseStr} למנה` },
    { label: 'שלב ד׳ — נפח לכל מנה', value: `${perDoseStr} ÷ ${concentration} מ"ג/מ"ל = ${volStr} למנה` },
  ];

  const freeWarningHtml = freeMode ? `
    <div class="warning-box" style="background:var(--danger-light);border-color:#fecaca;color:var(--danger);">
      <div>באחריות הקלינאי לוודא את נכונות המינון ואת אי-חריגה מהמינון המקסימלי המותר.</div>
    </div>` : '';

  resultArea.innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="result-drug">${esc(drugName)}</div>
        <div class="result-indication">${esc(indicationDisplay)}${indicationEn ? ' · ' + esc(indicationEn) : ''}</div>
        ${patientHeaderHtml}
      </div>
      <div class="result-body">
        ${allSteps.map(stepHtml).join('')}

        ${freeWarningHtml}

        <div class="result-summary">
          <div class="summary-line">
            תן ${volDisplay} — ${freqStr}${durationStr ? `<br>למשך ${durationStr}` : ''}<br>
            <span style="font-size:.88rem;font-weight:500;color:var(--gray-500);">ריכוז: ${concentration} מ"ג/מ"ל · מינון: ${perDoseStr} לנטילה</span>
          </div>
        </div>

        ${catalogNotes ? `<div class="notes-box">📋 ${esc(catalogNotes)}</div>` : ''}

        <div class="field" style="margin-top:16px;margin-bottom:0;">
          <label for="doctor-notes">הערות / הנחיות נוספות להורים</label>
          <textarea id="doctor-notes" rows="2" placeholder="לדוגמה: לתת אחרי האוכל..."></textarea>
        </div>
      </div>
      <div class="result-actions">
        <button class="btn btn-sm act-share" id="share-btn">📤 שליחה</button>
        <button class="btn btn-sm act-print" id="print-btn">🖨️ הדפסה</button>
        <button class="btn btn-sm act-reset" id="reset-btn">↺ איפוס</button>
      </div>
    </div>
  `;

  document.getElementById('share-btn').addEventListener('click', () => {
    const doctorNotes = document.getElementById('doctor-notes').value.trim();
    const shareText =
      (patientStr ? `👤 ${patientStr}\n` : '') +
      `💊 ${drugName}\n` +
      (indicationHe ? `${indicationHe}\n` : '') +
      `────────────\n` +
      `מינון: ${perDoseStr} למנה\n` +
      `נפח: ${volStr} למנה\n` +
      `תדירות: ${freqStr}\n` +
      (durationStr ? `למשך ${durationStr}\n` : '') +
      (doctorNotes ? `${doctorNotes}\n` : '') +
      `────────────\n` +
      `tinydose.drdevir.com`;

    if (navigator.share) {
      navigator.share({ title: 'TinyDose', text: shareText }).catch(() => {});
    } else {
      window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, '_blank');
    }
  });

  document.getElementById('print-btn').addEventListener('click', () => {
    const doctorNotes = document.getElementById('doctor-notes').value.trim();

    // Build the print document via DOM APIs (createElement/textContent) rather
    // than document.write(). Note: window.open('', '_blank') already returns a
    // document with a ready-made html/head/body structure — a subsequent
    // doc.open() call throws that away, leaving doc.head/doc.body null and
    // breaking every appendChild below. Don't call doc.open()/close().
    const printWin = window.open('', '_blank');
    if (!printWin) { showToast('אנא אפשר חלונות קופצים כדי להדפיס'); return; }
    const doc = printWin.document;
    doc.title = 'TinyDose';
    doc.documentElement.setAttribute('dir', 'rtl');

    const style = doc.createElement('style');
    style.textContent =
      'body{font-family:Arial,sans-serif;padding:20px;direction:rtl;}' +
      'h2{margin-bottom:4px;} p{margin:4px 0;font-size:14px;}' +
      '.box{border:1px solid #ccc;padding:12px;border-radius:8px;margin:12px 0;}' +
      '.step{margin:8px 0;}' +
      '.step-label{font-size:12px;font-weight:bold;color:#2563eb;}' +
      '.step-value{font-size:14px;}' +
      '.big{font-size:1.3em;font-weight:bold;color:#2563eb;}';
    doc.head.appendChild(style);

    const body = doc.body;

    if (patientStr) {
      const pPatient = doc.createElement('p');
      pPatient.style.fontWeight = 'bold';
      pPatient.textContent = `מטופל: ${patientStr}`;
      body.appendChild(pPatient);
    }

    const h2 = doc.createElement('h2');
    h2.textContent = '💊 ' + drugName;
    body.appendChild(h2);

    if (indicationHe) {
      const pIndication = doc.createElement('p');
      pIndication.textContent = freeMode ? `אבחנה: ${indicationHe}` : indicationHe;
      body.appendChild(pIndication);
    }

    const pWeight = doc.createElement('p');
    pWeight.textContent = `משקל הילד: ${weight} ק"ג`;
    body.appendChild(pWeight);

    const stepsBox = doc.createElement('div');
    stepsBox.className = 'box';
    allSteps.forEach(s => {
      const stepDiv = doc.createElement('div');
      stepDiv.className = 'step';
      const label = doc.createElement('div');
      label.className = 'step-label';
      label.textContent = s.label;
      const value = doc.createElement('div');
      value.className = 'step-value';
      value.textContent = s.value;
      stepDiv.appendChild(label);
      stepDiv.appendChild(value);
      stepsBox.appendChild(stepDiv);
    });
    body.appendChild(stepsBox);

    const resultBox = doc.createElement('div');
    resultBox.className = 'box';
    const resultLine = doc.createElement('p');
    resultLine.className = 'big';
    resultLine.textContent = `תן ${volStr} — ${freqStr}`;
    resultBox.appendChild(resultLine);
    if (durationStr) {
      const durLine = doc.createElement('p');
      durLine.textContent = `למשך ${durationStr}`;
      resultBox.appendChild(durLine);
    }
    body.appendChild(resultBox);

    if (catalogNotes) {
      const pClinical = doc.createElement('p');
      pClinical.textContent = `הערה קלינית: ${catalogNotes}`;
      body.appendChild(pClinical);
    }
    if (doctorNotes) {
      const pNotes = doc.createElement('p');
      pNotes.textContent = `הערה: ${doctorNotes}`;
      body.appendChild(pNotes);
    }

    const footer = doc.createElement('p');
    footer.style.fontSize = '12px';
    footer.style.color = '#999';
    footer.textContent = 'TinyDose — tinydose.drdevir.com | לשימוש רפואי בלבד';
    body.appendChild(footer);

    printWin.print();
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    if (freeMode) {
      renderFreeForm();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    document.getElementById('result-area').innerHTML = '';
    const wInput = document.getElementById('weight-input') || document.getElementById('ff-weight');
    if (wInput) { wInput.value = ''; wInput.focus(); }
  });

  if (scroll) document.getElementById('result-area').scrollIntoView({ behavior: 'smooth' });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>

</body>
</html>
